<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseDrop - Кейсы CS2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #12141d;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2233;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .balance {
            font-size: 18px;
            color: #4cd137;
            font-weight: bold;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .case-card {
            background: #1f2233;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #2f3542;
            transition: 0.3s;
        }
        .case-card:hover {
            border-color: #fbc531;
            transform: translateY(-5px);
        }
        .case-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .case-title {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn {
            background: #e84118;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover {
            background: #c23616;
        }
        
        /* Рулетка */
        #rouletteContainer {
            display: none;
            margin-top: 30px;
            background: #1f2233;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }
        .roulette-window {
            width: 100%;
            max-width: 600px;
            height: 160px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            background: #151723;
            border-radius: 10px;
            border: 2px solid #353b48;
        }
        .pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #fbc531;
            transform: translateX(-50%);
            z-index: 10;
        }
        .strip {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: left 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .item-card {
            min-width: 130px;
            height: 140px;
            background: #2f3542;
            margin-right: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-bottom: 4px solid #718093;
        }
        .item-card img {
            width: 75px;
            height: 55px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .item-name {
            font-size: 11px;
            font-weight: bold;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .item-price {
            font-size: 10px;
            color: #a4b0be;
            margin-top: 3px;
        }

        /* Цвета редкости */
        .grade-consumer { border-bottom-color: #b0c3d9; }
        .grade-milspec { border-bottom-color: #4b69ff; }
        .grade-restricted { border-bottom-color: #d32ce6; }
        .grade-classified { border-bottom-color: #eb4b4b; }
        .grade-covert { border-bottom-color: #e4ae39; }
        .grade-rare { border-bottom-color: #ffd700; }

        /* Модальное окно выигрыша */
        #winModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1f2233;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            border: 2px solid #fbc531;
        }
        .modal-content img {
            width: 140px;
            height: 100px;
            object-fit: contain;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <header>
        <h2>CaseDrop</h2>
        <div class="balance">Баланс: <span id="balance">1000</span> ₽</div>
    </header>

    <div class="cases-grid">
        <div class="case-card">
            <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV0924n4m8kvnnN7LEmyUE6pMgi7_Ho4ql3wbiqBVrNTzzLNDBJA88YFmCrFLqwe_vhJO-vZrNyXswvCMmsXqMlxKxwUsfSuNusbeOAw/360fx360f" alt="Кейс">
            <div class="case-title">Базовый кейс</div>
            <button class="btn" onclick="openCase(100)">Открыть (100 ₽)</button>
        </div>
        <div class="case-card">
            <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpou-6kejhz2v_Nfz5H_uO1gb-Gw_alIITGnGBg-sR_-b7S88mkjQbi-kVtN2qmcN6TegM3Y12Dr1m_k-rqhJe9uJ3JySFiuyZz7CvemBHgn1gSOeM3jE4h/360fx360f" alt="Кейс">
            <div class="case-title">Элитный кейс</div>
            <button class="btn" onclick="openCase(500)">Открыть (500 ₽)</button>
        </div>
    </div>

    <div id="rouletteContainer">
        <h3 id="caseOpeningTitle" style="margin-bottom: 15px;">Открытие кейса...</h3>
        <div class="roulette-window">
            <div class="pointer"></div>
            <div class="strip" id="strip"></div>
        </div>
        <button class="btn" id="openBtn" style="margin-top: 20px; display: none;" onclick="resetRoulette()">ВЫБРАТЬ ДРУГОЙ КЕЙС</button>
    </div>

    <!-- Модальное окно -->
    <div id="winModal">
        <div class="modal-content">
            <h3>Вы выиграли!</h3>
            <img id="winImg" src="" alt="Skin">
            <div id="winName" style="font-weight: bold; font-size: 16px; margin-bottom: 5px;"></div>
            <div id="winPrice" style="color: #4cd137; margin-bottom: 20px;"></div>
            <button class="btn" onclick="closeModal()">Забрать</button>
        </div>
    </div>

    <script>
        let balance = 1000;

        const allSkins = [
            {name: "MP9 | Закат", price: 60, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpopammOwJf1OD3cupL_-O5g5S0k8jgOP7VqWZU7cR1j9bN_Iv9nBrkqhBsZmCldo_EegJvZV3YrFnswe3rhJPt7subn3swvyNytX7D30Wvz7cTf3N3/360fx360f", class: "grade-consumer"},
            {name: "AK-47 | Сланец", price: 310, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot7HxfDhjxszJemkV0924n4m8kvnnN7LEmyUE6pMgi7_Ho4ql3wbiqBVrNTzzLNDBJA88YFmCrFLqwe_vhJO-vZrNyXswvCMmsXqMlxKxwUsfSuNusbeOAw/360fx360f", class: "grade-milspec"},
            {name: "M4A1-S | Огненный змей", price: 1500, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpou-6kejhz2v_Nfz5H_uO1gb-Gw_alIITGnGBg-sR_-b7S88mkjQbi-kVtN2qmcN6TegM3Y12Dr1m_k-rqhJe9uJ3JySFiuyZz7CvemBHgn1gSOeM3jE4h/360fx360f", class: "grade-classified"},
            {name: "AWP | Дикий огонь", price: 2100, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpot621FABz7PLfYQJD_9O7m5O0m_7zO6_umntd8-Z5g-7J4cuijga2r0RvMWvzd4eTIgJrNArW_Fjslu7u18e0tczNyXVkvCd35Xvfm0G-h00ZPLPj062OQw/360fx360f", class: "grade-covert"},
            {name: "Бабочка | Кровавая паутина", price: 25000, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpovbSxLEJyVzNHzLj369i5gYmLkuHXJ4Tck29Y_cg_g-uWp9qn3ge2-kBtNj-lLI6VegI3Z1zT81G2xbu705Tvu8icmyM3snQm4XmJnhK00x5JcLE7gwvO9w/360fx360f", class: "grade-rare"},
            {name: "USP-S | Убийца подтвержден", price: 4100, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpoov-kKAxl7PLKYgFH_9mkgL-OlvXxDLjQjWA97cZmhuDG_Zi72wewqhBvN22hd9SQcgM3ZAzY-1i_xLjrh5Duu8jNynpg7Ccg7GHfwUJvD9oT1Q/360fx360f", class: "grade-covert"},
            {name: "Desert Eagle | Пламя", price: 3200, img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgposr-kLAtl7PLZTjlH_9mkgL-OlvXxDLjQjWA97cZmhuDG_Zi72wewqhBvN22hd9SQcgM3ZAzY-1i_xLjrh5Duu8jNynpg7Ccg7GHfwUJvD9oT1Q/360fx360f", class: "grade-classified"}
        ];

        function openCase(price) {
            if (balance < price) {
                alert("Недостаточно средств на балансе!");
                return;
            }
            balance -= price;
            document.getElementById('balance').innerText = balance;

            document.getElementById('rouletteContainer').style.display = 'block';
            document.getElementById('caseOpeningTitle').innerText = `Открытие кейса (${price} ₽)...`;
            document.getElementById('openBtn').style.display = 'none';

            generateStrip();
            
            setTimeout(() => {
                spinRoulette();
            }, 100);
        }

        let winningSkinData = null;

        function generateStrip() {
            const strip = document.getElementById('strip');
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.left = '0px';

            // Генерируем ленту из 60 элементов
            for (let i = 0; i < 60; i++) {
                const randomSkin = allSkins[Math.floor(Math.random() * allSkins.length)];
                const card = document.createElement('div');
                card.className = `item-card ${randomSkin.class}`;
                card.innerHTML = `
                    <img src="${randomSkin.img}" alt="skin">
                    <div class="item-name">${randomSkin.name}</div>
                    <div class="item-price">${randomSkin.price} ₽</div>
                `;
                strip.appendChild(card);
            }
        }

        function spinRoulette() {
            const strip = document.getElementById('strip');
            const cardWidth = 140; // ширина карточки (130px) + отступ (10px)
            const winningIndex = 45; // Точный индекс выигрышной карточки на ленте
            
            const winningCard = strip.children[winningIndex];
            
            // Жестко считываем данные именно той карточки, на которую укажет стрелочка
            winningSkinData = {
                name: winningCard.querySelector('.item-name').innerText,
                price: parseInt(winningCard.querySelector('.item-price').innerText),
                img: winningCard.querySelector('img').src
            };

            // Вычисляем смещение до центра экрана рулетки
            const offset = (winningIndex * cardWidth) - (300) + (cardWidth / 2);
            
            strip.style.transition = 'left 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
            strip.style.left = `-${offset}px`;

            setTimeout(() => {
                showWinModal(winningSkinData);
            }, 4100);
        }

        function showWinModal(skin) {
            document.getElementById('winImg').src = skin.img;
            document.getElementById('winName').innerText = skin.name;
            document.getElementById('winPrice').innerText = `Цена: ${skin.price} ₽`;
            document.getElementById('winModal').style.display = 'flex';

            // Зачисляем выигрыш на баланс
            balance += skin.price;
            document.getElementById('balance').innerText = balance;
            
            document.getElementById('caseOpeningTitle').innerText = `Вы выиграли: ${skin.name} (${skin.price} ₽)`;
            document.getElementById('openBtn').style.display = 'inline-block';
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
        }

        function resetRoulette() {
            document.getElementById('rouletteContainer').style.display = 'none';
        }
    </script>
</body>
</html>
