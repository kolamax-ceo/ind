<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUB UP App</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>RUB UP Interface</h2>
        <p>Введите данные для обработки:</p>
        <input type="text" id="userInput" placeholder="Сумма или актив...">
        <button onclick="sendData()">Подтвердить</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Растягиваем на весь экран

        function sendData() {
            let val = document.getElementById('userInput').value;
            if(!val) {
                alert('Поле не должно быть пустым!');
                return;
            }
            // Отправляем данные обратно в чат боту и закрываем приложение
            tg.sendData("Запрос на апгрейд: " + val);
        }
    </script>
</body>
</html>
