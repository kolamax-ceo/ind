<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaseDrop - Открытие кейсов CS2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #12141d; color: #fff; text-align: center; padding-bottom: 50px; }
        header { background: #181b28; padding: 15px; font-size: 20px; font-weight: bold; border-bottom: 2px solid #232738; }
        .balance-container { margin: 20px 0; font-size: 18px; }
        .balance { color: #00ffcc; font-weight: bold; }
        
        .cases-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 0 20px; margin-bottom: 30px; }
        .case-card { background: #1c2030; border-radius: 12px; width: 160px; padding: 15px; border: 2px solid #282d42; cursor: pointer; transition: 0.2s; }
        .case-card:hover { transform: translateY(-5px); border-color: #00ffcc; }
        .case-card img { width: 100%; height: 100px; object-fit: contain; margin-bottom: 10px; }
        .case-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .case-price { color: #00ffcc; font-size: 14px; }

        /* Рулетка */
        .roulette-container { display: none; margin: 30px auto; width: 90%; max-width: 600px; background: #181b28; border-radius: 15px; padding: 20px; border: 2px solid #2d334a; }
        .roulette-window { overflow: hidden; width: 100%; height: 140px; background: #0e1017; border-radius: 10px; position: relative; display: flex; align-items: center; border: 2px solid #00ffcc; }
        .roulette-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ff0055; transform: translateX(-50%); z-index: 10; }
        .strip { display: flex; position: absolute; left: 0; transition: left 4s cubic-bezier(0.15, 0.85, 0.35, 1); }
        
        .item-card { min-width: 120px; height: 120px; background: #1c2030; margin: 0 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; border-bottom: 4px solid #777; }
        .item-card img { width: 75px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .item-name { font-size: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .item-price { font-size: 11px; color: #00ffcc; margin-top: 3px; }

        /* Цвета редкости */
        .grade-consumer { border-bottom-color: #b0c3d9; }
        .grade-milspec { border-bottom-color: #4b69ff; }
        .grade-restricted { border-bottom-color: #d32ce6; }
        .grade-classified { border-bottom-color: #eb4b4b; }
        .grade-covert { border-bottom-color: #e4ae33; }
        .grade-rare { border-bottom-color: #ffd700; }

        .btn { background: #00ffcc; color: #12141d; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn:hover { background: #00b38f; color: #fff; }

        /* Модальное окно выигрыша */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1c2030; padding: 30px; border-radius: 15px; text-align: center; max-width: 350px; width: 90%; border: 2px solid #00ffcc; }
        .modal-content img { width: 140px; height: 90px; object-fit: contain; margin: 15px 0; }
    </style>
</head>

        function openCase(price) {
            if (balance < price) {
                alert("Недостаточно средств на балансе!");
                return;
            }
            balance -= price;
            currentCasePrice = price;
            document.getElementById('balance').innerText = balance;

            document.getElementById('rouletteContainer').style.display = 'block';
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('caseOpeningTitle').innerText = `Открытие кейса (${price} ₽)...`;

            generateStrip();
            
            setTimeout(() => {
                spinRoulette();
            }, 100);
        }

        function generateStrip() {
            const strip = document.getElementById('strip');
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.left = '0px';

            // Генерируем 60 случайных предметов для полосы прокрутки
            for (let i = 0; i < 60; i++) {
                const randomSkin = allSkins[Math.floor(Math.random() * allSkins.length)];
                const card = document.createElement('div');
                card.className = `item-card ${randomSkin.class}`;
                card.innerHTML = `
                    <img src="${randomSkin.img}" alt="skin">
                    <div class="item-name">${randomSkin.name}</div>
                    <div class="item-price">${randomSkin.price} ₽</div>
                `;
                // Сохраняем данные скина в DOM-элемент
                card.dataset.name = randomSkin.name;
                card.dataset.price = randomSkin.price;
                card.dataset.img = randomSkin.img;
                strip.appendChild(card);
            }
        }

        let winningSkinData = null;

        function spinRoulette() {
            const strip = document.getElementById('strip');
            const cardWidth = 130; // 120px ширина + 10px отступы
            // Выбираем победный элемент примерно на 45-й позиции
            const winningIndex = 45; 
            
            const winningCard = strip.children[winningIndex];
            winningSkinData = {
                name: winningCard.dataset.name,
                price: parseInt(winningCard.dataset.price),
                img: winningCard.dataset.img
            };

            // Сдвигаем ленту так, чтобы победный элемент оказался ровно по центру указателя
            const offset = (winningIndex * cardWidth) - (window.innerWidth > 600 ? 300 : window.innerWidth / 2) + (cardWidth / 2);
            
            strip.style.transition = 'left 4s cubic-bezier(0.15, 0.85, 0.35, 1)';
            strip.style.left = `-${offset}px`;

            setTimeout(() => {
                showWinModal(winningSkinData);
            }, 4100);
        }

        function showWinModal(skin) {
            document.getElementById('winImg').src = skin.img;
            document.getElementById('winName').innerText = skin.name;
            document.getElementById('winPrice').innerText = `Цена: ${skin.price} ₽`;
            document.getElementById('winModal').style.display = 'flex';

            // Возвращаем стоимость выигрыша на баланс
            balance += skin.price;
            document.getElementById('balance').innerText = balance;
            document.getElementById('caseOpeningTitle').innerText = `Вы выиграли: ${skin.name} (${skin.price} ₽)`;
            document.getElementById('openBtn').style.display = 'inline-block';
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
        }
    </script>
</body>
</html>
